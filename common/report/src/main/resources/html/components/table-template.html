<table class="tb-report-table">
    <colgroup>
        <col th:each="colKey : ${columns.keySet()}"
             th:attrappend="width=${columns[colKey].width != null ? columns[colKey].width : null}">
    </colgroup>
    <thead>
    <tr th:if="${showTableHeading}"
        th:style="|height: ${headingHeight};|">
        <th class="tb-report-table-heading"
            th:colspan="${columns.size()}"
            th:style="|text-align: ${headingTextAlignment};
                 vertical-align: ${headingVerticalAlignment};
                 color: ${headingColor};
                 padding: 0;
                 margin: 0;
                 font-size: ${headingFontSize}pt;
                 font-family: ${headingFontFamily};
                 font-style: ${headingFontStyle};
                 font-weight: ${headingFontWeight};|"
            th:utext="${headingText}">Title</th>
    </tr>
    <tr>
        <th th:each="colKey : ${columns.keySet()}"
            th:style="|display: table-cell;
                 ${columns[colKey].textAlignment != null ? 'text-align:' + columns[colKey].textAlignment + ';' : ''}
                 ${columns[colKey].verticalAlignment != null ? 'vertical-align:' + columns[colKey].verticalAlignment + ';' : ''}
                 ${columns[colKey].color != null ? 'color:' + columns[colKey].color + ';' : ''}
                 ${columns[colKey].backgroundColor != null ? 'background-color:' + columns[colKey].backgroundColor + ';' : ''}
                 ${columns[colKey].fontSize != null ? 'font-size:' + columns[colKey].fontSize + 'pt;' : ''}
                 ${columns[colKey].fontFamily != null ? 'font-family:' + columns[colKey].fontFamily + ';' : ''}
                 ${columns[colKey].fontStyle != null ? 'font-style:' + columns[colKey].fontStyle + ';' : ''}
                 ${columns[colKey].fontWeight != null ? 'font-weight:' + columns[colKey].fontWeight + ';' : ''}|"
            th:text="${columns[colKey].value}">Header</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="row : ${rows}">
        <td th:each="colKey : ${columns.keySet()}"
            th:style="|display: table-cell;
                 ${row[colKey].textAlignment != null ? 'text-align:' + row[colKey].textAlignment + ';' : ''}
                 ${row[colKey].verticalAlignment != null ? 'vertical-align:' + row[colKey].verticalAlignment + ';' : ''}
                 ${row[colKey].color != null ? 'color:' + row[colKey].color + ';' : ''}
                 ${row[colKey].backgroundColor != null ? 'background-color:' + row[colKey].backgroundColor + ';' : ''}
                 ${row[colKey].fontSize != null ? 'font-size:' + row[colKey].fontSize + 'pt;' : ''}
                 ${row[colKey].fontFamily != null ? 'font-family:' + row[colKey].fontFamily + ';' : ''}
                 ${row[colKey].fontStyle != null ? 'font-style:' + row[colKey].fontStyle + ';' : ''}
                 ${row[colKey].fontWeight != null ? 'font-weight:' + row[colKey].fontWeight + ';' : ''}|"
            th:text="${row[colKey].value}">[Value]</td>
    </tr>
    <!-- Empty table fallback row -->
    <tr th:if="${#lists.isEmpty(rows)}">
        <td style="text-align: center;"
            th:colspan="${columns.size()}"
            th:text="${noDataMessage}">Table content is empty</td>
    </tr>
    </tbody>
</table>
