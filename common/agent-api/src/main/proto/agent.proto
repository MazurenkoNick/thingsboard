syntax = "proto3";

option go_package = "github.com/thingsboard/tb-agent/gen/agent/v1;agentv1";

option java_package = "org.thingsboard.server.gen.agent.v1";
option java_multiple_files = true;

option java_outer_classname = "AgentProtos";

service AgentRpcService {
  rpc controlStream(stream AgentToServer) returns (stream ServerToAgent);

//  // (2) Logs: server requests logs, agent streams chunks
//  rpc StreamLogs(LogRequest) returns (stream LogChunk);
//
//  // (3) Statuses: agent periodically streams current state (docker/compose)
//  rpc ReportStatus(stream StatusEnvelope) returns (google.protobuf.Empty);
}

message AgentToServer {
  oneof msg {
    Hello hello = 1;
    CommandAck ack = 2;
    CommandProgress progress = 3;
    CommandResult result = 4;
    Heartbeat heartbeat = 5;
  }
}

message ServerToAgent {
  oneof msg {
    InstallCommand installCommand = 1;
    HelloAck helloAck = 2;
  }
}

message InstallCommand {
  CommandId commandId = 1;
  int64 step = 2;
  string appName = 3;
  AppType appType = 4;
  Metadata meta = 5;
}

message Metadata {
  map<string, string> data = 1;
}

enum AppType {
  DOCKER_COMPOSE = 0;
}

message Heartbeat {
  int64 ts = 1;
}

message Hello {
  int64 agentIdMSB = 1;
  int64 agentIdLSB = 2;
}

message HelloAck {
  bool success = 1;
}

message CommandAck {
  CommandId commandId = 1;
  AckStatus status = 2;
  string message = 3;
  int64 step = 4;
}

enum AckStatus {
  ACCEPTED = 0;
  REJECTED = 1;
}

message CommandProgress {
  CommandId commandId = 1;
  string stage = 2;        // "pulling", "creating", "starting"
  string message = 3;      // user-friendly
  int64 step = 4;
}

message CommandResult {
  CommandId command_id = 1;
  bool success = 2;
  string message = 3;
  int64 step = 4;
//  google.protobuf.Struct details = 4;
}

message CommandId {
  int64 idMSB = 1;
  int64 idLSB = 2;
}
