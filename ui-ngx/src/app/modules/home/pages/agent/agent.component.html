<!--
  Status indicator: rendered inside a hidden host so it doesn't show in the
  agent's form area. ngAfterViewInit moves the inner span into the toolbar's
  .tb-details-title — works for both the full details page and the side
  details panel since both wrappers use the same .details-toolbar /
  .tb-details-title classes.x
-->
<div class="tb-agent-header-status-host" aria-hidden="true">
  <span *ngIf="entity?.id?.id"
        #statusBadge
        class="tb-agent-header-status"
        [class.tb-agent-header-status--online]="agentOnline"
        [class.tb-agent-header-status--offline]="!agentOnline"
        [matTooltip]="(agentOnline ? 'agent.online' : 'agent.offline') | translate"
        matTooltipPosition="above">
    <span class="tb-agent-header-status-dot"></span>
  </span>
</div>
<div class="tb-details-buttons xs:flex xs:flex-col">
  <button mat-raised-button color="primary"
          [disabled]="(isLoading$ | async)"
          (click)="onEntityAction($event, 'open')"
          [class.!hidden]="isEdit || isDetailsPage">
    {{'common.open-details-page' | translate }}
  </button>
  <button mat-raised-button color="accent"
          [disabled]="(isLoading$ | async)"
          (click)="onManageApplications($event)"
          [class.!hidden]="isEdit || !entity?.id">
    <mat-icon>apps</mat-icon>
    <span translate>agent.manage-applications</span>
  </button>
  @if (canManageOwnerAndGroups()) {
    <button mat-raised-button color="primary"
            [disabled]="(isLoading$ | async)"
            (click)="onEntityAction($event, 'manageOwnerAndGroups')"
            [class.!hidden]="isEdit || !entity?.id">
      {{'entity-group.manage-owner-and-groups' | translate }}
    </button>
  }
  <button mat-raised-button color="primary"
          [disabled]="(isLoading$ | async)"
          (click)="onEntityAction($event, 'unassignFromCustomer')"
          [class.!hidden]="isEdit || (agentScope !== 'customer' && agentScope !== 'tenant') || !isAssignedToCustomer(entity)">
    {{'agent.unassign-from-customer' | translate }}
  </button>
  <button mat-raised-button color="primary"
          [disabled]="(isLoading$ | async)"
          (click)="onEntityAction($event, 'delete')"
          [class.!hidden]="hideDelete() || isEdit">
    {{'agent.delete' | translate }}
  </button>
  <div class="flex flex-row flex-wrap xs:flex-col">
    <button mat-raised-button
            ngxClipboard
            (cbOnSuccess)="onAgentInfoCopied('id')"
            [cbContent]="entity?.id?.id"
            [disabled]="(isLoading$ | async)"
            [class.!hidden]="isEdit">
      <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
      <span translate>agent.copy-id</span>
    </button>
    <button mat-raised-button
            ngxClipboard
            (cbOnSuccess)="onAgentInfoCopied('key')"
            [cbContent]="entity?.routingKey"
            [disabled]="(isLoading$ | async)"
            [class.!hidden]="isEdit || agentScope === 'customer_user'">
      <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
      <span translate>agent.copy-routing-key</span>
    </button>
    <button mat-raised-button
            ngxClipboard
            (cbOnSuccess)="onAgentInfoCopied('secret')"
            [cbContent]="entity?.secret"
            [disabled]="(isLoading$ | async)"
            [class.!hidden]="isEdit || agentScope === 'customer_user'">
      <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
      <span translate>agent.copy-secret</span>
    </button>
  </div>
  <div class="flex flex-row flex-wrap xs:flex-col">
    <button mat-raised-button color="primary"
            [disabled]="(isLoading$ | async)"
            (click)="onEntityAction($event, 'openInstallInstructions')"
            [class.!hidden]="isEdit || agentScope === 'customer_user'">
      <mat-icon>terminal</mat-icon>
      <span translate>agent.install-instructions</span>
    </button>
  </div>
</div>
<div class="mat-padding flex flex-col">
  <mat-form-field class="mat-block" appearance="outline"
                  [class.!hidden]="isEdit || !isAssignedToCustomer(entity)
                              || entity?.customerIsPublic || agentScope !== 'tenant'">
    <mat-label translate>agent.assigned-to-customer</mat-label>
    <input matInput disabled [ngModel]="entity?.customerTitle">
  </mat-form-field>
  <form [formGroup]="entityForm">
    <fieldset [disabled]="(isLoading$ | async) || !isEdit">
      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>agent.name</mat-label>
        <input matInput formControlName="name" required>
        <mat-error *ngIf="entityForm.get('name').hasError('required')">
          {{ 'agent.name-required' | translate }}
        </mat-error>
        <mat-error *ngIf="entityForm.get('name').hasError('maxlength')">
          {{ 'agent.name-max-length' | translate }}
        </mat-error>
      </mat-form-field>
    </fieldset>
    <div class="flex flex-row" [class.!hidden]="agentScope === 'customer_user'">
      <mat-form-field class="mat-block flex-1" appearance="outline">
        <mat-label translate>agent.routing-key</mat-label>
        <input matInput formControlName="routingKey">
      </mat-form-field>
      <button mat-icon-button type="button" ngxClipboard (cbOnSuccess)="onAgentInfoCopied('key')"
              [cbContent]="entityForm?.get('routingKey').value"
              matTooltip="{{'agent.copy-routing-key' | translate}}">
        <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
      </button>
    </div>
    <div class="flex flex-row" [class.!hidden]="agentScope === 'customer_user'">
      <mat-form-field class="mat-block flex-1" appearance="outline">
        <mat-label translate>agent.secret</mat-label>
        <input matInput formControlName="secret">
      </mat-form-field>
      <button mat-icon-button type="button" ngxClipboard (cbOnSuccess)="onAgentInfoCopied('secret')"
              [cbContent]="entityForm?.get('secret').value"
              matTooltip="{{'agent.copy-secret' | translate}}">
        <mat-icon svgIcon="mdi:clipboard-arrow-left"></mat-icon>
      </button>
    </div>
    <fieldset [disabled]="(isLoading$ | async) || !isEdit">
      <tb-agent-profile-autocomplete
          [class.!hidden]="agentScope === 'customer_user'"
          formControlName="agentProfileId"
          [required]="true"
          [showDetailsPageLink]="true"
          [selectDefaultProfile]="isAdd">
      </tb-agent-profile-autocomplete>
    </fieldset>
    <fieldset [disabled]="(isLoading$ | async) || !isEdit">
      <mat-form-field class="mat-block" appearance="outline">
        <mat-label translate>agent.description</mat-label>
        <textarea matInput formControlName="description" rows="2"></textarea>
      </mat-form-field>
    </fieldset>
  </form>
</div>
