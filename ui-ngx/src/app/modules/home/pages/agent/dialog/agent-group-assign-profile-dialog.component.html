<div mat-dialog-title class="dialog-header">
  <h2 translate>agent.assign-profile</h2>
  <button mat-icon-button (click)="cancel()" tabindex="-1">
    <mat-icon>close</mat-icon>
  </button>
</div>
<div mat-dialog-content class="dialog-body">
  <mat-form-field class="full-width" *ngIf="profiles.length">
    <mat-label translate>agent.app-profile</mat-label>
    <mat-select [(value)]="selectedProfileId" required>
      <mat-option *ngFor="let profile of profiles" [value]="profile.id.id">
        {{ profile.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>
  <div class="tb-empty" *ngIf="!profiles.length" translate>
    agent.no-profiles-available
  </div>
</div>
<div mat-dialog-actions align="end" class="dialog-footer">
  <button mat-button (click)="cancel()">{{ 'action.cancel' | translate }}</button>
  <button mat-raised-button color="primary"
          [disabled]="!selectedProfileId"
          (click)="confirm()">
    {{ 'action.assign' | translate }}
  </button>
</div>
