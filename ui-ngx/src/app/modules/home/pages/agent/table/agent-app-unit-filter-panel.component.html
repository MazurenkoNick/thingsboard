<form class="mat-content mat-padding flex flex-col tb-agent-app-filter-panel" (ngSubmit)="apply()">
  <div class="tb-form-panel no-padding no-border">
    <div class="tb-form-row column-xs">
      <div class="fixed-title-width" translate>agent.app-type</div>
      <mat-form-field class="flex-1" appearance="outline" subscriptSizing="dynamic">
        <mat-select [(ngModel)]="draft.type" [ngModelOptions]="{ standalone: true }"
                    placeholder="{{ 'common.all' | translate }}">
          <mat-option [value]="null">{{ 'common.all' | translate }}</mat-option>
          <mat-option *ngFor="let t of typeOptions" [value]="t">{{ t }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
  <div class="tb-panel-actions flex flex-row items-center justify-end">
    <button type="button" mat-button color="primary" (click)="reset()">{{ 'action.reset' | translate }}</button>
    <span class="flex-1"></span>
    <button type="button" mat-button (click)="cancel()">{{ 'action.cancel' | translate }}</button>
    <button type="submit" mat-raised-button color="primary">{{ 'action.update' | translate }}</button>
  </div>
</form>
