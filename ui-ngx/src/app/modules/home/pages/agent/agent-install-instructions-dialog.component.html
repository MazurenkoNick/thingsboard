<div mat-dialog-title class="tb-agent-install-dialog-header">
  <h2>{{ dialogTitle | translate }}</h2>
  <button mat-icon-button (click)="close()" tabindex="-1">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div mat-dialog-content class="tb-agent-install-dialog-body">

  <section class="credentials-section">
    <h3>
      <mat-icon class="success-icon">check_circle</mat-icon>
      <span translate>agent.agent-credentials</span>
    </h3>

    <div class="credential-row">
      <label translate>agent.routing-key</label>
      <div class="value-box">
        <span class="value">{{ agent?.routingKey }}</span>
      </div>
      <button mat-icon-button
              ngxClipboard
              [cbContent]="agent?.routingKey"
              (cbOnSuccess)="onCopied('key')"
              [matTooltip]="'agent.copy-routing-key' | translate">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>

    <div class="credential-row">
      <label translate>agent.secret</label>
      <div class="value-box">
        <span class="value">{{ agent?.secret }}</span>
      </div>
      <button mat-icon-button
              ngxClipboard
              [cbContent]="agent?.secret"
              (cbOnSuccess)="onCopied('secret')"
              [matTooltip]="'agent.copy-secret' | translate">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>
  </section>

  <mat-divider></mat-divider>

  <section class="instructions-section">
    <h3 translate>agent.install-instructions</h3>
    <p translate>agent.install-instructions-hint</p>

    <div class="step-label">
      <span class="step-num">1</span>
      <span translate>agent.install-step-docker</span>
    </div>

    <div class="step-label">
      <span class="step-num">2</span>
      <span translate>agent.install-step-run</span>
    </div>

    <div class="command-block">
      <button mat-flat-button class="copy-command-btn"
              ngxClipboard
              [cbContent]="dockerCommand"
              (cbOnSuccess)="onCopied('command')">
        <mat-icon>content_copy</mat-icon>
        <span translate>action.copy</span>
      </button>
      <pre>{{ dockerCommand }}</pre>
    </div>

    <div class="tb-info-box">
      <mat-icon>info</mat-icon>
      <span translate>agent.install-instructions-replace-hint</span>
    </div>
  </section>

</div>

<div mat-dialog-actions align="end" class="tb-agent-install-dialog-footer">
  <button mat-button (click)="close()">
    {{ 'action.close' | translate }}
  </button>
  <button mat-raised-button color="primary" *ngIf="afterAdd && agent?.id?.id"
          (click)="goToAgent()">
    <mat-icon>open_in_new</mat-icon>
    <span translate>agent.go-to-agent</span>
  </button>
</div>
